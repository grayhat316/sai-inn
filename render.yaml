# Render blueprint: push to GitHub and this deploys by itself.
# Service name here becomes the URL: https://sai-inn.onrender.com
services:
  - type: web
    name: sai-inn
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: SAI_ADMIN_USER
        value: admin
      # Render asks you for this one when the blueprint is created: it becomes
      # the admin password on first boot. Never stored in the repository.
      - key: SAI_ADMIN_PASSWORD
        sync: false
